apply plugin: 'war'

// A plain (non-Spring Boot) WAR that declares a Main-Class. The class is also
// copied to the archive root so that `java -cp . <Main-Class>` can load it.
tasks.named('war') {
    from(sourceSets.main.output.classesDirs)
    manifest {
        attributes 'Main-Class': 'org.cloudfoundry.test.Main'
    }
}
